<!doctype html>
<!-- Source for the 1280×640 social card. Render with: npm run social-card -->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
    body {
      background: radial-gradient(circle at 78% 40%, #1d2a3d 0%, #18181a 62%);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e8e8ea; display: flex; align-items: center;
    }
    .text { width: 470px; padding-left: 72px; }
    .text img { width: 96px; height: 96px; }
    h1 { font-size: 64px; margin: 18px 0 10px; letter-spacing: -0.02em; }
    p { font-size: 25px; line-height: 1.35; color: #b4b4bc; margin: 0 0 26px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tags span { font-size: 16px; padding: 5px 10px; border-radius: 5px; background: rgba(0,132,255,0.14); border: 1px solid rgba(0,132,255,0.5); }
    .repo { margin-top: 28px; font-size: 17px; color: #6e6e76; }
    .shot {
      position: absolute; right: -40px; top: 70px; width: 760px; border-radius: 10px; overflow: hidden;
      border: 1px solid #38383e; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }
    .shot img { display: block; width: 100%; }
  </style>
</head>
<body>
  <div class="text">
    <img src="../build/icon.png" alt="" />
    <h1>MeshAnimate</h1>
    <p>Pivot-style pose-to-pose animation for rigged Blender characters.</p>
    <div class="tags"><span>Onion skin</span><span>Blender IK</span><span>Snapping</span><span>Saves to .blend</span></div>
    <div class="repo">github.com/stuyk/meshanimate</div>
  </div>
  <div class="shot"><img src="../docs/screenshots/posing.png" alt="" /></div>
</body>
</html>
